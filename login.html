<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
}

.login-box{
    max-width:400px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#0057b8;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#ffb300;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="login-box">

<h2>Student Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button type="button"
onclick="loginUser()">
Login
</button>

</div>
<script>
function loginUser(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

let savedEmail = localStorage.getItem("email");
let savedPassword = localStorage.getItem("password");

if(email === savedEmail && password === savedPassword){

    alert("Login Successful");

    window.location.href = "payment.html";

}else{

    alert("Invalid Email or Password");

}

}
</script>
</body>
</html>
